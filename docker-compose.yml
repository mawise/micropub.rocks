version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - BASE_URL=http://localhost:8080/
      - REDIS_URL=tcp://redis:6379
      - DB_HOST=db
      - DB_NAME=micropubrocks
      - DB_USER=micropubrocks
      - DB_PASS=secretpassword
      - APP_SECRET=secret
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=micropubrocks
      - MYSQL_USER=micropubrocks
      - MYSQL_PASSWORD=secretpassword
    volumes:
      - ./database:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"

  redis:
    image: redis:6
    ports:
      - "6379:6379"
